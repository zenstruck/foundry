default:
    testers:
        stop_on_failure: true

    gherkin:
        cache: var/cache/gherkin

    extensions:
        Yceruto\BehatExtension\Extension\ExceptionExtension: ~
        Zenstruck\Foundry\Test\Behat\FoundryExtension:
            database_reset_mode: scenario
            enable_dama_support: true
        Behat\MinkExtension:
            sessions:
                symfony:
                    symfony: ~
        FriendsOfBehat\SymfonyExtension:
            bootstrap: tests/bootstrap.php
            kernel:
                class: Zenstruck\Foundry\Test\Behat\Tests\Fixture\BehatTestKernel

    suites:
        main:
            paths: [features/main]
            contexts: &common_contexts
                - Behat\MinkExtension\Context\MinkContext
                - Zenstruck\Foundry\Test\Behat\Tests\Fixture\TestFoundryContext

main-no-dama:
    extensions:
        Zenstruck\Foundry\Test\Behat\FoundryExtension:
            database_reset_mode: scenario
            enable_dama_support: false

    suites:
        main: false
        main-no-dama:
            paths: [features/main]
            contexts: *common_contexts

main-native-dama:
    extensions:
        DAMA\DoctrineTestBundle\Behat\ServiceContainer\DoctrineExtension: ~
        Zenstruck\Foundry\Test\Behat\FoundryExtension:
            database_reset_mode: scenario
            enable_dama_support: false

    suites:
        main: false
        main-native-dama:
            paths: [features/main]
            contexts: *common_contexts

reset-manual:
    extensions:
        Zenstruck\Foundry\Test\Behat\FoundryExtension:
            database_reset_mode: manual
            enable_dama_support: false

    suites:
        main: false
        reset-manual:
            paths: [features/reset-manual]
            contexts: *common_contexts

reset-manual-dama:
    extensions:
        Zenstruck\Foundry\Test\Behat\FoundryExtension:
            database_reset_mode: manual
            enable_dama_support: true

    suites:
        main: false
        reset-manual-dama:
            paths: [features/reset-manual]
            contexts: *common_contexts

reset-feature:
    extensions:
        Zenstruck\Foundry\Test\Behat\FoundryExtension:
            database_reset_mode: feature
            enable_dama_support: false

    suites:
        main: false
        reset-feature:
            paths: [features/reset-feature]
            contexts: *common_contexts


reset-feature-dama:
    extensions:
        Zenstruck\Foundry\Test\Behat\FoundryExtension:
            database_reset_mode: feature
            enable_dama_support: true

    suites:
        main: false
        reset-feature-dama:
            paths: [features/reset-feature]
            contexts: *common_contexts

reset-disabled:
    extensions:
        Zenstruck\Foundry\Test\Behat\FoundryExtension:
            database_reset_mode: disabled
            enable_dama_support: false

    suites:
        main: false
        reset-disabled:
            paths: [features/reset-disabled]
            contexts:
                - Behat\MinkExtension\Context\MinkContext
                - Zenstruck\Foundry\Test\Behat\Tests\Fixture\TestFoundryContext
                - Zenstruck\Foundry\Test\Behat\Tests\Fixture\ResetDisabledTestContext
