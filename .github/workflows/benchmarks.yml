name: Benchmarks with Tally

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/benchmarks.yml
      - bin/tools/tally/**
      - src/**
      - tests/Benchmark/**
      - composer.json
      - tally.php

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  run:
    name: Benchmarks (3.x vs PR)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SYMFONY_REQUIRE: 8.1.*
      # with sqlite, the SQL engine runs in the PHP process and its instructions are counted
      DATABASE_URL: sqlite:///%kernel.project_dir%/var/data.db
      MONGO_URL: mongodb://127.0.0.1:27017/dbName?compressors=disabled&amp;gssapiServiceName=mongodb
      USE_DAMA_DOCTRINE_TEST_BUNDLE: 0

    services:
      mongo:
        image: mongo:4
        ports:
          - 27017:27017

    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          extensions: posix
          coverage: none
          tools: flex

      # side-by-side checkouts with paths of the same length: each side gets its own vendor/ and var/cache/,
      # and the memory layout of both sides is the same
      - name: Checkout 3.x
        uses: actions/checkout@v4
        with:
          ref: 3.x
          path: base
          fetch-depth: 1

      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          path: head
          fetch-depth: 1

      - name: Install dependencies (3.x)
        uses: ramsey/composer-install@v2
        with:
          working-directory: base
          composer-options: --prefer-dist

      - name: Install dependencies (PR)
        uses: ramsey/composer-install@v2
        with:
          working-directory: head
          composer-options: --prefer-dist

      - name: Install Tally
        working-directory: head
        run: composer bin tally install

      # no expected numbers are committed: the numbers of 3.x, measured with the PR's benchmarks, become the expected ones.
      # A benchmark that does not exist on 3.x yet would also be "new" and pass.
      - name: Run benchmarks on 3.x
        run: |
          rm -rf base/tests/Benchmark
          cp -r head/tests/Benchmark base/tests/Benchmark
          cp head/tally.php base/tally.php
          cd base
          GITHUB_ACTIONS=false "$GITHUB_WORKSPACE/head/bin/tools/tally/vendor/phpstan/tally/bin/tally" run --jobs=1 --output="$RUNNER_TEMP/tally-3.x"

      - name: Run benchmarks on the PR
        working-directory: head
        run: |
          TALLY="$GITHUB_WORKSPACE/head/bin/tools/tally/vendor/phpstan/tally/bin/tally"
          $TALLY accept "$RUNNER_TEMP/tally-3.x"
          GITHUB_WORKSPACE="$PWD" $TALLY run --jobs=1 --output="$RUNNER_TEMP/tally-pr"
