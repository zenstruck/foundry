name: Lint docs

on:
  push:
    paths: &paths
      - .github/workflows/lint-docs.yml
      - docs/**
  pull_request:
    paths: *paths

concurrency:
  # a run on a release branch gets its own group: merging several PRs in a row must not cancel the previous runs
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (contains(fromJSON('["2.x", "3.x"]'), github.ref_name) && github.run_id) || github.ref }}
  cancel-in-progress: true

jobs:
  lint-docs:
    name: Lint Documentation
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v3

      - name: DOCtor-RST
        uses: docker://oskarstark/doctor-rst
        with:
          args: --short --error-format=github
        env:
          DOCS_DIR: 'docs/'
