name: Behat

on:
  push:
    # the Behat suite runs against the checkout's zenstruck/foundry (installed from the
    # monorepo as a composer path repository) and against the shared test fixtures:
    # a change in the main package must also trigger this workflow
    paths: &paths
      - .github/workflows/behat.yml
      - src/**
      - config/**
      - tests/Fixture/**
      - composer.json
  pull_request:
    paths: *paths
  schedule:
    - cron: '0 0 1,16 * *'

defaults:
  run:
    shell: bash
    working-directory: ./src/Test/Behat

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  behat:
    name: Behat - P:${{ matrix.php }}, S:${{ matrix.symfony }}${{ matrix.deps == 'lowest' && ' (lowest)' || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ 8.3, 8.5 ]
        symfony: [ 6.4.*, 7.4.* ]
        deps: [ highest, lowest ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: flex

      - name: Pin Doctrine ORM 2 and its php80 polyfill for the lowest deps
        if: ${{ matrix.deps == 'lowest' }}
        run: composer require --dev "doctrine/orm:^2.16" symfony/polyfill-php80:^1.16 --no-update

      # install zenstruck/foundry from the checkout instead of Packagist, so the suite runs
      # the branch's code with its dependencies resolved transitively; composer refuses to
      # install a path package inside its own source tree, hence the copy outside of it
      - name: Install zenstruck/foundry from the checkout
        run: |
          rsync -a --exclude=.git --exclude=vendor ../../../ "$RUNNER_TEMP/foundry-checkout/"
          composer config repositories.foundry "{\"type\": \"path\", \"url\": \"$RUNNER_TEMP/foundry-checkout\", \"options\": {\"versions\": {\"zenstruck/foundry\": \"2.99.0\"}}}"

      - name: Install dependencies
        uses: ramsey/composer-install@v2
        with:
          working-directory: "src/Test/Behat"
          dependency-versions: ${{ matrix.deps }}
          composer-options: --prefer-dist
        env:
          SYMFONY_REQUIRE: ${{ matrix.symfony }}

      - name: "Main test suite: reset DB at scenario level, with Dama support"
        run: vendor/bin/behat --colors -vvv

      - name: "Main test suite: reset DB at scenario level, without Dama support"
        run: vendor/bin/behat --colors -vvv --profile=main-no-dama

      - name: "Main test suite: reset DB at scenario level, with native Dama extension"
        run: vendor/bin/behat --colors -vvv --profile=main-native-dama --tags='~@skip-with-native-dama'

      - name: Manual reset DB
        run: vendor/bin/behat --colors -vvv --profile=reset-manual

      - name: Manual reset DB and Dama support
        run: vendor/bin/behat --colors -vvv --profile=reset-manual-dama

      - name: Reset DB at feature level
        run: vendor/bin/behat --colors -vvv --profile=reset-feature

      - name: Reset DB at feature level with Dama support
        run: vendor/bin/behat --colors -vvv --profile=reset-feature-dama

      - name: Reset DB disabled
        run: vendor/bin/behat --colors -vvv --profile=reset-disabled

      - name: Overriding built-in step definitions
        run: vendor/bin/behat --colors -vvv --profile=override-steps

      - name: Using a subset of the built-in contexts
        run: vendor/bin/behat --colors -vvv --profile=granular-contexts

  phpunit:
    name: PHPUnit - P:${{ matrix.php }}, S:${{ matrix.symfony }}${{ matrix.deps == 'lowest' && ' (lowest)' || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ 8.3, 8.5 ]
        symfony: [ 6.4.*, 7.4.* ]
        deps: [ highest, lowest ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: flex

      - name: Pin Doctrine ORM 2 and its php80 polyfill for the lowest deps
        if: ${{ matrix.deps == 'lowest' }}
        run: composer require --dev "doctrine/orm:^2.16" symfony/polyfill-php80:^1.16 --no-update

      # install zenstruck/foundry from the checkout instead of Packagist, so the suite runs
      # the branch's code with its dependencies resolved transitively; composer refuses to
      # install a path package inside its own source tree, hence the copy outside of it
      - name: Install zenstruck/foundry from the checkout
        run: |
          rsync -a --exclude=.git --exclude=vendor ../../../ "$RUNNER_TEMP/foundry-checkout/"
          composer config repositories.foundry "{\"type\": \"path\", \"url\": \"$RUNNER_TEMP/foundry-checkout\", \"options\": {\"versions\": {\"zenstruck/foundry\": \"2.99.0\"}}}"

      - name: Install dependencies
        uses: ramsey/composer-install@v2
        with:
          working-directory: "src/Test/Behat"
          dependency-versions: ${{ matrix.deps }}
          composer-options: --prefer-dist
        env:
          SYMFONY_REQUIRE: ${{ matrix.symfony }}

      - name: Run tests
        run: vendor/bin/phpunit

  phpstan:
    name: PhpStan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          coverage: none
          tools: flex

      # install zenstruck/foundry from the checkout instead of Packagist, so the suite runs
      # the branch's code with its dependencies resolved transitively; composer refuses to
      # install a path package inside its own source tree, hence the copy outside of it
      - name: Install zenstruck/foundry from the checkout
        run: |
          rsync -a --exclude=.git --exclude=vendor ../../../ "$RUNNER_TEMP/foundry-checkout/"
          composer config repositories.foundry "{\"type\": \"path\", \"url\": \"$RUNNER_TEMP/foundry-checkout\", \"options\": {\"versions\": {\"zenstruck/foundry\": \"2.99.0\"}}}"

      - name: Install dependencies
        uses: ramsey/composer-install@v2
        with:
          working-directory: "src/Test/Behat"
          composer-options: --prefer-dist
        env:
          SYMFONY_REQUIRE: 7.4.*

      - name: Install PHPStan
        run: composer bin phpstan install

      - name: Run PHPStan
        run: ../../../bin/tools/phpstan/vendor/phpstan/phpstan/phpstan
