default:
    testers:
        stop_on_failure: true
    suites:
        default:
            contexts:
                - Behat\MinkExtension\Context\MinkContext
                - Zenstruck\Foundry\Tests\Fixture\Behat\TestContext
                - Zenstruck\Foundry\Test\Behat\FoundryContext
            paths:
                - tests/behatFeatures
    extensions:
        Zenstruck\Foundry\Test\Behat\FoundryExtension: ~
        Behat\MinkExtension:
            sessions:
                symfony:
                    symfony: ~
        FriendsOfBehat\SymfonyExtension:
            bootstrap: tests/bootstrap.php
            kernel:
                class: Zenstruck\Foundry\Tests\Fixture\Behat\BehatTestKernel

